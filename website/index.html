      // Initialize PostHog only on official domain.
      // cookieless_mode 'on_reject': nothing is captured until the banner choice is made;
      // after a denial, events are sent without cookies/localStorage identity and counted
      // via a server-side hash (requires "Cookieless server hash mode" in PostHog project settings).
      (function() {
        var isOfficialDomain = window.location.hostname === 'one-prompt.app' || window.location.hostname === 'www.one-prompt.app';
        if (isOfficialDomain) {
          posthog.init('__POSTHOG_API_KEY__', {
            api_host: '__POSTHOG_HOST__',
            cookieless_mode: 'on_reject',
            person_profiles: 'identified_only',
            capture_pageview: true,
            capture_pageleave: true,
            autocapture: true,
            enable_heatmaps: true,
            persistence: 'localStorage+cookie',
            session_recording: {
              maskAllInputs: false,
              maskInputOptions: {
                password: true
              }
            },
            // Added per event (not via register) so the props survive the reset done on consent changes.
            // Like register(), keep a platform the event already carries (download_clicked sends the chosen OS).
            before_send: function(event) {
              if (event) {
                event.properties = event.properties || {};
                event.properties.source = 'website';
                if (event.properties.platform == null) event.properties.platform = 'website';
              }
              return event;
            },
            loaded: function(posthog) {
              // The banner choice in localStorage is the source of truth: align PostHog's consent with it
              var consent = localStorage.getItem('cookieConsent');
              var status = posthog.get_explicit_consent_status();
              if (consent === 'true') {
                if (status !== 'granted') posthog.opt_in_capturing({ captureEventName: false });
                posthog.startSessionRecording();
              } else if (consent === 'false') {
                if (status !== 'denied') posthog.opt_out_capturing();
              } else if (status !== 'pending') {
                posthog.clear_opt_in_out_capturing();
              }
            }
          });
        }
      })();
